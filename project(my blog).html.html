<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor Shadow Inside Box</title>
  <style>
    body {
      background-color: #0fc4e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    h1 {
      color: #c3f00c;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(234, 234, 16, 0.12);
    }

    /* wrapper is positioned so child .cursor-shadow is anchored to it */
    .box-wrapper {
      position: relative;
      width: 320px;
      height: 220px;
      border: 2px solid #ebf30e;
      border-radius: 10px;
      background: white;
      overflow: auto;
      font-family: monospace;
      font-size: 16px;
      line-height: 1.4;
      padding: 10px;
      box-sizing: border-box;
      caret-color: black;
    }

    /* the editable area fills the wrapper, uses transparent background */
    .text-box {
      width: 100%;
      height: 100%;
      outline: none;
      border: none;
      background: transparent;
      resize: none;
      overflow: auto;
      white-space: pre-wrap; /* preserve new lines */
      word-break: break-word;
    }

    .cursor-shadow {
      position: absolute;        /* positioned relative to .box-wrapper */
      width: 2px;
      height: 1.2em;             /* match line height */
      background: rgba(0, 0, 0, 0.45);
      border-radius: 2px;
      pointer-events: none;
      box-shadow: 5px 0 10px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 20;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Blog</h1>

  <div class="box-wrapper" id="box">
    <!-- contenteditable text area -->
    <div class="text-box" id="editable" contenteditable="true" spellcheck="false"></div>

    <!-- shadow must be inside same wrapper -->
    <div class="cursor-shadow" id="shadow"></div>
  </div>

  <script>
    const editable = document.getElementById('editable');
    const shadow = document.getElementById('shadow');
    const wrapper = document.getElementById('box');
    let hideTimeout;

    // Get caret rectangle (returns DOMRect or null)
    function getCaretRect() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return null;
      const range = sel.getRangeAt(0).cloneRange();

      // If selection is not collapsed (text selected), try collapse to end to get caret rect
      if (!range.collapsed) {
        range.collapse(false);
      }

      // Insert a temporary zero-width span if getClientRects is empty
      if (range.getClientRects().length === 0) {
        // try to insert a zero-width marker
        const marker = document.createElement('span');
        // zero-width non-breaking space ensures marker shows up
        marker.appendChild(document.createTextNode('\u200b'));
        range.insertNode(marker);
        const rect = marker.getBoundingClientRect();
        marker.parentNode.removeChild(marker);
        // restore selection (move caret back)
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        return rect;
      }

      return range.getClientRects()[0];
    }

    // Update the shadow's left/top relative to wrapper
    function updateShadowPosition() {
      const caretRect = getCaretRect();
      if (!caretRect) return;

      const wrapperRect = wrapper.getBoundingClientRect();
      const rightOffset = 10; // px to the right of caret

      // Compute left/top inside wrapper coordinates (account for wrapper scroll)
      const leftInside = (caretRect.right - wrapperRect.left) + rightOffset + wrapper.scrollLeft;
      const topInside = (caretRect.top - wrapperRect.top) + wrapper.scrollTop;

      // Keep shadow inside wrapper bounds
      const maxLeft = wrapper.clientWidth - 4; // keep a few px from right edge
      const clampedLeft = Math.min(Math.max(2, leftInside), maxLeft);

      shadow.style.left = clampedLeft + 'px';
      shadow.style.top = topInside + 'px';
      // match shadow height to current line height
      const computedLineHeight = parseFloat(getComputedStyle(editable).lineHeight) || 18;
      shadow.style.height = computedLineHeight + 'px';
    }

    function showShadow() {
      clearTimeout(hideTimeout);
      updateShadowPosition();
      shadow.style.opacity = 1;
      hideTimeout = setTimeout(() => { shadow.style.opacity = 0; }, 1000);
    }

    // Events that should show/move the shadow
    ['input', 'keyup', 'keydown', 'click', 'focus'].forEach(evt => {
      editable.addEventListener(evt, showShadow);
    });

    // Update on scroll
    wrapper.addEventListener('scroll', updateShadowPosition);

    // Hide when focus lost
    editable.addEventListener('blur', () => { shadow.style.opacity = 0; });

    // Live follow while the editable has focus
    const RAF_INTERVAL = 16; // ~60fps
    function liveFollow() {
      if (document.activeElement === editable) {
        updateShadowPosition();
      }
      setTimeout(liveFollow, RAF_INTERVAL);
    }
    liveFollow();

    // initial placeholder text (optional)
    editable.textContent = ''; // empty to start
  </script>
</body>
</html>
